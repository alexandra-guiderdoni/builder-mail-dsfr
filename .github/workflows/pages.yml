name: Diagnostic confirmation 145 paire R1 exacte
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: diagnostic-confirmation-145
  cancel-in-progress: false
jobs:
  forensic:
    if: github.ref == 'refs/heads/diag/issue-145-confirmation-causal'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Lire le harnais de la branche diagnostic
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: harness
          persist-credentials: false
      - name: Lire le snapshot applicatif exact du rouge
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: f3aa8324dbcd255bddafeeb2eec559e698f6065c
          path: snapshot
          persist-credentials: false
      - name: Fixer Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24.18.0'
      - name: Vérifier Ubuntu 26 x64 et enregistrer l’image sans la sélectionner
        run: |
          python3 - <<'PY'
          import os,json,platform,pathlib,subprocess
          data=dict(line.split('=',1) for line in pathlib.Path('/etc/os-release').read_text().splitlines() if '=' in line)
          info={'os':data.get('ID','').strip('"'),'release':data.get('VERSION_ID','').strip('"'),'architecture':platform.machine(),'ImageOS':os.environ.get('ImageOS'),'ImageVersion':os.environ.get('ImageVersion'),'source':subprocess.check_output(['git','-C','snapshot','rev-parse','HEAD'],text=True).strip(),'harness':subprocess.check_output(['git','-C','harness','rev-parse','HEAD'],text=True).strip()}
          pathlib.Path('host-r1-145.json').write_text(json.dumps(info,indent=2)+'\n')
          assert info['os']=='ubuntu' and info['release']=='26.04' and info['architecture']=='x86_64', info
          assert info['source']=='f3aa8324dbcd255bddafeeb2eec559e698f6065c'
          PY
      - name: Installer le verrou Playwright du snapshot
        working-directory: snapshot
        run: npm ci --ignore-scripts
      - name: Installer uniquement Chromium
        working-directory: snapshot
        run: npx --no-install playwright install --with-deps chromium
      - name: Vérifier R1 exact et préparer les deux dossiers indépendants
        run: |
          set -euo pipefail
          diag_dir="$GITHUB_WORKSPACE/harness/docs/goal-six-issues-20261025/investigations/145-native-red-40216251444/r1-pair"
          cd "$diag_dir"
          sha256sum --check <<'SHA'
          127fec761916ef3962176b981588df37443a9baaa3bf03a2de7b36fdabcefda4  loop-confirmation.cjs
          065c9d06fd804c7f8adbeb5bed0210d4f6b848d8d4d310ffadc2214a533550d5  trace-confirmation.cjs
          e74d8d9aa39359e4fb5ce7d447090c5ddc77181f0376e6aad60d9d2599e980d8  prepare-comparator.py
          SHA
          mkdir evidence
          mkdir evidence/baseline evidence/comparator
          cp loop-confirmation.cjs trace-confirmation.cjs evidence/baseline/
          cp loop-confirmation.cjs trace-confirmation.cjs evidence/comparator/
          cmp evidence/baseline/loop-confirmation.cjs evidence/comparator/loop-confirmation.cjs
          cmp evidence/baseline/trace-confirmation.cjs evidence/comparator/trace-confirmation.cjs
          python3 prepare-comparator.py --repo "$GITHUB_WORKSPACE/snapshot" --output "$GITHUB_WORKSPACE/comparator" --receipt evidence/comparator-preparation.json > evidence/comparator-preparation.log 2>&1
      - name: Paire R1 exacte, arrêt au premier rouge de chaque bras, sans relance
        env:
          PASSES: '30'
          SCENARIO: full
          RESULT: result.json
        run: |
          set -uo pipefail
          export PLAYWRIGHT_MODULE="$GITHUB_WORKSPACE/snapshot/node_modules/playwright"
          diag_dir="$GITHUB_WORKSPACE/harness/docs/goal-six-issues-20261025/investigations/145-native-red-40216251444/r1-pair"
          set +e
          MAIL_BUILDER_ROOT="$GITHUB_WORKSPACE/snapshot" node "$diag_dir/evidence/baseline/loop-confirmation.cjs" > "$diag_dir/evidence/baseline/run.log" 2>&1
          baseline_status=$?
          MAIL_BUILDER_ROOT="$GITHUB_WORKSPACE/comparator" node "$diag_dir/evidence/comparator/loop-confirmation.cjs" > "$diag_dir/evidence/comparator/run.log" 2>&1
          comparator_status=$?
          set -e
          printf '{"baseline":%s,"comparator":%s}\n' "$baseline_status" "$comparator_status" > "$diag_dir/evidence/pair-exit-status.json"
          cat "$diag_dir/evidence/baseline/run.log" "$diag_dir/evidence/comparator/run.log"
      - name: Classer hors navigateur, témoin vert signifie non-reproduction
        if: always()
        run: |
          diag_dir="$GITHUB_WORKSPACE/harness/docs/goal-six-issues-20261025/investigations/145-native-red-40216251444/r1-pair"
          python3 "$diag_dir/parse-pair.py" --evidence "$diag_dir/evidence" --snapshot "$GITHUB_WORKSPACE/snapshot" --comparator "$GITHUB_WORKSPACE/comparator" --host "$GITHUB_WORKSPACE/host-r1-145.json" --output "$GITHUB_WORKSPACE/receipt-r1-145.json"
      - name: Conserver les deux bras, sources exactes et reçus même sur échec
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: confirmation-r1-145-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: error
          retention-days: 7
          path: |
            host-r1-145.json
            receipt-r1-145.json
            harness/docs/goal-six-issues-20261025/investigations/145-native-red-40216251444/r1-pair/loop-confirmation.cjs
            harness/docs/goal-six-issues-20261025/investigations/145-native-red-40216251444/r1-pair/trace-confirmation.cjs
            harness/docs/goal-six-issues-20261025/investigations/145-native-red-40216251444/r1-pair/prepare-comparator.py
            harness/docs/goal-six-issues-20261025/investigations/145-native-red-40216251444/r1-pair/parse-pair.py
            harness/docs/goal-six-issues-20261025/investigations/145-native-red-40216251444/r1-pair/proposal-pages.yml
            harness/docs/goal-six-issues-20261025/investigations/145-native-red-40216251444/r1-pair/evidence/
